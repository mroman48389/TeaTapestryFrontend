# Full CD staging pipeline for Tea Tapestry Frontend. Runs when CI finishes on pushes to the 
# develop branch only. Ensures develop branch is always healthy and performance-checked 
# before merging to main branch. Runs the following in order:
#     1. CI (via the separate Frontend Integration workflow in ci_frontend.yml).
#     2. Deployment to Netlify (staging)
#     3. Smoke tests
#     4. Visual regression tests
#     5. Lighthouse CI
#
# Note that the node versions used for the jobs below are intentionally different. The various
# tests we perform are stable with Node 20 but not so much with more recent versions of Node. We
# stay at Node 22 for the deployments since this build toolchain (Vite, Tailwind, other dependencies)
# seem stable at this version.

name: Staging Deployment

on:
  # This pipeline runs ONLY after the Frontend Integration CI workflow finishes.
  workflow_run:
    workflows: ["Frontend Integration"]
    types: [completed]
    branches: [develop]

  # Allow manual triggering.
  workflow_dispatch:

concurrency:
  # Only allow one instance of the Staging Deployment workflow to run at a time.
  group: staging-deployment-pipeline
  # Cancel previous pipeline processes if there is a new CI completion event.
  cancel-in-progress: true

jobs:

  # ------------------------------------------------------------
  # 1. Deploy to Netlify staging if CI passes
  # ------------------------------------------------------------

  deploy_staging:

    # Run continuous integration (linting, tests, security audits) on
    # pushes to develop branch.
    if: github.event.workflow_run.conclusion == 'success' 

    name: Deploy to Netlify Staging
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        env:
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
        run: npm run build

      - name: Install Netlify CLI
        run: npm install -g netlify-cli

      - name: Deploy to Netlify Staging
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_STAGING_SITE_ID }}
        run: netlify deploy --prod-if-unlocked --dir=dist --site=$NETLIFY_SITE_ID

  # ------------------------------------------------------------
  # 2. Run smoke tests if staging deploy succeeds.
  #
  # Basic tests that make sure the deployed staging app is 
  # running.
  # ------------------------------------------------------------

  smoke_tests:
    name: Smoke Tests (Playwright)
    needs: deploy_staging
    runs-on: ubuntu-latest
    env:
      FRONTEND_STAGING_URL: ${{ secrets.FRONTEND_STAGING_URL }}
      BACKEND_STAGING_URL: ${{ secrets.BACKEND_STAGING_URL }}
      # We don't want dotenvx overriding our Playwright .env variables.
      DOTENVX_DISABLE: true

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Cache browsers for Playwright to speed things up.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Debug env vars
        run: |
          echo "FRONTEND_STAGING_URL=$FRONTEND_STAGING_URL"
          echo "BACKEND_STAGING_URL=$BACKEND_STAGING_URL"

      - name: Run smoke tests
        run: npx playwright test smoke

  # ------------------------------------------------------------
  # 3. Run visual regression tests if smoke tests succeed. 
  #
  # Prevents unintentional UI changes from ever making it to 
  # production.
  # ------------------------------------------------------------

  visual_tests:
    name: Visual Regression Tests (Playwright)
    needs: smoke_tests
    runs-on: ubuntu-latest
    env:
      FRONTEND_STAGING_URL: ${{ secrets.FRONTEND_STAGING_URL }}
      # We don't want dotenvx overriding our Playwright .env variables.
      DOTENVX_DISABLE: true

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Cache browsers for Playwright to speed things up.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run visual regression tests
        run: npx playwright test visual

  # ------------------------------------------------------------
  # 4. Run Lighthouse CI if smoke tests succeed.
  #
  # Validates the actual staging app, catching CDN caching
  # issues, Netlify build differences, environment-specific
  # regressions, backend latency affecting TTFB, third-party
  # script behavior in staging. The real world Lighthouse score.
  # ------------------------------------------------------------

  lighthouse:
    name: Lighthouse CI (Staging)
    needs: visual_tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Lighthouse CI
        run: npm run lhci
