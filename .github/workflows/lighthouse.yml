name: Lighthouse CI

on:
  # Catch performance regressions before merging. Catches
  # new dependencies that add bloat, images that are too
  # large, layout shifts from new components, new scripts
  # that block rendering, new animations that hurt performance.
  workflow_dispatch:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

  # Run this workflow if the one in cd_staging.yml completes.
  # Validates the actual staging app, catching CDN caching
  # issues, Netlify build differences, environment-specific
  # regressions, backend latency affecting TTFB, third-party
  # script behavior in staging. The real world Lighthouse score.
  workflow_run:
    workflows: ["Staging Deployment"]
    types: [completed]

jobs:
  lighthouse:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run Lighthouse CI
        run: npm run lhci
